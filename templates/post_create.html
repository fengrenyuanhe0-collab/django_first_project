{% extends 'base.html' %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <h2 style="color: #2196F3;">Create New Blog Post</h2>
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            {{ form.title.label_tag }}
            {{ form.title }}
        </div>
        <div style="margin-bottom: 15px;">
            {{ form.text.label_tag }}
            {{ form.text }}
        </div>
        <button type="submit" style="background: #2196F3; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
            Publish Post
        </button>
        <a href="{% url 'home' %}" style="margin-left: 10px; color: #666; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
