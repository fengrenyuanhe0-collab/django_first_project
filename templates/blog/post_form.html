{% extends 'admin/base_site.html' %}

{% block content %}
<div class="module aligned" style="margin:20px; padding:20px; background:#fff; border-radius:8px; box-shadow:0 0 5px #ccc;">
    <h2 style="margin-bottom:20px;">Add Post</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        
        <div class="form-row">
            {{ form.title.label_tag }}
            {{ form.title }}
            {{ form.title.errors }}
        </div>

        <div class="form-row" style="margin-top:15px;">
            {{ form.text.label_tag }}
            {{ form.text }}
            {{ form.text.errors }}
        </div>

        <div style="margin-top:25px;">
            <button type="submit" class="default" style="padding:10px 20px; background:#79aec8; color:white; border:none; border-radius:4px; cursor:pointer;">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
