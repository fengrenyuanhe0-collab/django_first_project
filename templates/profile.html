<!-- templates/profile.html -->
{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2 style="color: #2196F3;">Your Profile</h2>
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="id_nickname">Nickname:</label>
            {{ form.nickname }}
        </div>
        <button type="submit" style="background: #2196F3; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
            Save Nickname
        </button>
    </form>
</div>
{% endblock %}
