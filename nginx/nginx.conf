# 配置反向代理，指向Django容器
upstream blog_web {
    server web:8000;  # web是docker-compose里的服务名
}

server {
    listen 80;  # 容器内监听80端口
    server_name localhost;

    # 处理静态文件（Django的collectstatic收集的文件）
    location /static/ {
        alias /app/static/;
    }

    # 所有请求转发给Django
    location / {
        proxy_pass http://blog_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}